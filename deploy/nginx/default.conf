# Security headers live in security-headers.conf, included by every proxied
# location: nginx drops inherited add_header directives in any location that
# declares its own add_header (e.g. /assets/), so inheritance alone is unsafe.

# Edge rate limits (http context only). The app has its own per-endpoint
# limits; these stop volumetric abuse before it reaches the JVM.
limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=3r/s;

server {
    listen 80;
    server_name melipet.shop www.melipet.shop;

    # ACME challenge for certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Always land on the apex: the 443 server/certificate only serves
    # melipet.shop (issue the cert with `-d www.melipet.shop` as well if you
    # want to serve https://www directly).
    location / {
        return 301 https://melipet.shop$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name melipet.shop;

    ssl_certificate     /etc/letsencrypt/live/melipet.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/melipet.shop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    include /etc/nginx/snippets/security-headers.conf;

    limit_req_status 429;

    client_max_body_size 12m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    # Trust the proxy so Secure cookies / redirects work behind TLS
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;

    # Metrics/health are scraped inside the docker network only.
    location /actuator {
        return 404;
    }

    # Stricter limit on auth endpoints (matches the app's RateLimitFilter paths)
    location ~ ^/(login|register|logout|forgot-password|reset-password|verify-email)$ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://app:8080;
        proxy_read_timeout 60s;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Long cache for static assets (the app also sends cache headers)
    location /assets/ {
        limit_req zone=general burst=40 nodelay;
        proxy_pass http://app:8080;
        expires 7d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        limit_req zone=general burst=40 nodelay;
        proxy_pass http://app:8080;
        proxy_read_timeout 60s;
    }
}
