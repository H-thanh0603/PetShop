server {
    listen 80;
    server_name melipet.shop www.melipet.shop;

    # ACME challenge for certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS once certificates exist.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name melipet.shop;

    ssl_certificate     /etc/letsencrypt/live/melipet.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/melipet.shop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 12m;

    # Trust the proxy so Secure cookies / redirects work behind TLS
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;

    # Long cache for static assets (the app also sends cache headers)
    location /assets/ {
        proxy_pass http://app:8080;
        proxy_cache_valid 200 1d;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://app:8080;
        proxy_read_timeout 60s;
    }
}
