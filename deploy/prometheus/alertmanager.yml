# Minimal valid config: alerts fire into the UI (Prometheus /alerts and the
# Grafana alerting view) until a real channel is wired up.
#
# To actually get paged, add an integration below — e.g. Telegram:
#   receivers:
#     - name: default
#       telegram_configs:
#         - bot_token: "<bot token via env/secret>"
#           chat_id: 123456789
# and mount it the same way in docker-compose.prod.yml.
route:
  receiver: default
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
