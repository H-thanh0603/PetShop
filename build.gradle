plugins {
    id 'java-library'
    id 'maven-publish'
    id 'war'
    id 'org.springframework.boot' version '4.1.1'
}

group = 'com.petshop'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')

    // Spring Boot 4: web -> webmvc
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.apache.tomcat.embed:tomcat-embed-jasper'

    // Spring Boot 4: flyway-core -> spring-boot-starter-flyway
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    // P2: Spring Data JPA (Hibernate 7, BOM-managed)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // Boot 4 starter chỉ kèm flyway-core; MySQL cần module riêng (BOM quản lý version)
    implementation 'org.flywaydb:flyway-mysql'

    implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api'
    implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl'
    implementation 'com.mysql:mysql-connector-j'
    implementation 'jakarta.mail:jakarta.mail-api'
    implementation 'org.eclipse.angus:jakarta.mail'
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'com.zaxxer:HikariCP'
    implementation 'org.slf4j:slf4j-api'
    implementation 'ch.qos.logback:logback-classic'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.86'

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testImplementation 'net.jqwik:jqwik:1.10.1'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Boot 4: test slices tách khỏi test-autoconfigure — @DataJpaTest nằm ở module riêng
    testImplementation 'org.springframework.boot:spring-boot-data-jpa-test'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
}

// secrets.properties carries real credentials in local dev (gitignored).
// Keep it out of packaged artifacts: a WAR/image must never ship secrets —
// production reads them from the environment (docker-compose .env).
// Local dev boot needs PETSHOP_DB_PASSWORD / VNPAY_* etc. via env instead.
processResources {
    exclude '**/secrets.properties'
}

test {
    useJUnitPlatform()
    // Docker Desktop exposes the engine API on a user-level socket and rejects
    // pre-1.40 API calls; forward the location + a supported version to the
    // test JVM explicitly (daemon env is not inherited).
    if (System.getenv('DOCKER_HOST')) {
        environment 'DOCKER_HOST', System.getenv('DOCKER_HOST')
        environment 'DOCKER_API_VERSION', System.getenv('DOCKER_API_VERSION') ?: '1.44'
    }
    // Repository tests (JpaTestConfig) read the local petshop MySQL password
    // from the env; forward it for the same reason as DOCKER_HOST (daemon env
    // is not inherited from the client).
    if (System.getenv('PETSHOP_DB_PASSWORD')) {
        environment 'PETSHOP_DB_PASSWORD', System.getenv('PETSHOP_DB_PASSWORD')
    }
    if (System.getenv('DB_PASSWORD')) {
        environment 'DB_PASSWORD', System.getenv('DB_PASSWORD')
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:deprecation']
}

springBoot {
    mainClass = 'com.petshop.PetShopApplication'
}

// WAR thường (ROOT.war cho Tomcat ngoài) đã bỏ — chỉ còn bootWar (JSP cần WAR).
tasks.named('war') {
    enabled = false
}

tasks.named('bootWar') {
    archiveFileName = 'petshop-boot.war'
}
