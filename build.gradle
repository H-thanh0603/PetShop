plugins {
    id 'java-library'
    id 'maven-publish'
    id 'war'
    id 'org.springframework.boot' version '3.3.4'
}

group = 'com.petshop'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url = uri('https://oss.sonatype.org/content/repositories/snapshots')
    }
}

dependencies {
    // Spring Boot BOM manages versions for all org.springframework.* and
    // tomcat/flyway/mail artifacts below.
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.3.4')
    providedRuntime platform('org.springframework.boot:spring-boot-dependencies:3.3.4')

    providedCompile 'jakarta.servlet:jakarta.servlet-api:6.0.0'

    // Spring Boot (web + embedded Tomcat + JSP + actuator)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.apache.tomcat.embed:tomcat-embed-jasper'
    providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'

    // Flyway replaces the ad-hoc migrations that used to run from DBContext
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'

    implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:3.0.0'
    implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1'
    implementation 'com.mysql:mysql-connector-j:8.0.33'
    implementation 'jakarta.mail:jakarta.mail-api:2.1.2'
    implementation 'org.eclipse.angus:jakarta.mail:2.0.2'
    implementation 'commons-fileupload:commons-fileupload:1.5'
    implementation 'commons-io:commons-io:2.15.1'
    implementation 'org.apache.httpcomponents:fluent-hc:4.5.14'
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.mindrot:jbcrypt:0.4'

    // HikariCP connection pool (Spring Boot manages its version from 3.3.x)
    implementation 'com.zaxxer:HikariCP:5.1.0'

    // SLF4J + Logback
    implementation 'org.slf4j:slf4j-api:2.0.13'
    implementation 'ch.qos.logback:logback-classic:1.5.6'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.12.0'
    testImplementation 'org.mockito:mockito-inline:5.2.0'
    testImplementation 'net.jqwik:jqwik:1.8.4'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation platform('org.testcontainers:testcontainers-bom:1.21.3')
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
}

configurations.configureEach {
    resolutionStrategy.force 'com.google.code.gson:gson:2.10.1'
}

test {
    useJUnitPlatform()
    // Docker Desktop exposes the engine API on a user-level socket and rejects
    // pre-1.40 API calls; forward the location + a supported version to the
    // test JVM explicitly (daemon env is not inherited).
    if (System.getenv('DOCKER_HOST')) {
        environment 'DOCKER_HOST', System.getenv('DOCKER_HOST')
        environment 'DOCKER_API_VERSION', System.getenv('DOCKER_API_VERSION') ?: '1.44'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

springBoot {
    mainClass = 'com.petshop.PetShopApplication'
}

// Plain WAR for external Tomcat (legacy deploy path until the migration
// completes). bootWar is the executable artifact: java -jar petshop-boot.war
tasks.named('war') {
    enabled = true
    archiveFileName = 'ROOT.war'
}

tasks.named('bootWar') {
    archiveFileName = 'petshop-boot.war'
}
