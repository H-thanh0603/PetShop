plugins {
    id 'java-library'
    id 'maven-publish'
    id 'war'
    id 'org.springframework.boot' version '4.1.1'
}

group = 'com.petshop'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    providedRuntime platform('org.springframework.boot:spring-boot-dependencies:4.1.1')

    providedCompile 'jakarta.servlet:jakarta.servlet-api:6.1.0'

    // Spring Boot 4: web -> webmvc
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.apache.tomcat.embed:tomcat-embed-jasper'
    providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'

    // Spring Boot 4: flyway-core -> spring-boot-starter-flyway
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    // Boot 4 starter chỉ kèm flyway-core; MySQL cần module riêng (BOM quản lý version)
    implementation 'org.flywaydb:flyway-mysql'

    implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api'
    implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl'
    implementation 'com.mysql:mysql-connector-j'
    implementation 'jakarta.mail:jakarta.mail-api'
    implementation 'org.eclipse.angus:jakarta.mail'
    implementation 'com.google.code.gson:gson'          // gỡ ở Task 10
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'com.zaxxer:HikariCP'
    implementation 'org.slf4j:slf4j-api'
    implementation 'ch.qos.logback:logback-classic'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.86'

    // Tạm thời: diagnostic property đổi tên, GỠ ở Task 11
    runtimeOnly 'org.springframework.boot:spring-boot-properties-migrator'

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testImplementation 'net.jqwik:jqwik:1.10.1'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
}

test {
    useJUnitPlatform()
    // Docker Desktop exposes the engine API on a user-level socket and rejects
    // pre-1.40 API calls; forward the location + a supported version to the
    // test JVM explicitly (daemon env is not inherited).
    if (System.getenv('DOCKER_HOST')) {
        environment 'DOCKER_HOST', System.getenv('DOCKER_HOST')
        environment 'DOCKER_API_VERSION', System.getenv('DOCKER_API_VERSION') ?: '1.44'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:deprecation']
}

springBoot {
    mainClass = 'com.petshop.PetShopApplication'
}

// Plain WAR for external Tomcat (legacy deploy path until the migration
// completes). bootWar is the executable artifact: java -jar petshop-boot.war
tasks.named('war') {
    enabled = true
    archiveFileName = 'ROOT.war'
}

tasks.named('bootWar') {
    archiveFileName = 'petshop-boot.war'
}
