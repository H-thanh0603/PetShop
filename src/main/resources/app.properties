# Base application URL and deploy settings
app.base-url=http://localhost:8080/PetShop
app.context-path=/PetShop
# Cookie Secure flag: unset => cookies are Secure whenever the request itself
# is secure (HTTPS). Production must terminate TLS at nginx. To force Secure
# cookies regardless of scheme, set app.cookies.secure=true (or the
# APP_COOKIES_SECURE env var, which the gradle deploy tasks already set).
deploy.tomcat-home=
app.static.cache.max-age-seconds=86400

# Social login redirect URI examples:
# Google authorized redirect URI: ${app.base-url}/LoginByGoogleServlet
# Production example: https://melipet.shop/PetShop/LoginByGoogleServlet

# Checkout client config
api.provinces.base-url=https://provinces.open-api.vn/api/v1
payment.bank.pending-minutes=10

# Bank transfer display config.
# Real account number/name MUST come from secrets.properties (gitignored) or
# environment variables (PAYMENT_BANK_ACCOUNT_NUMBER, PAYMENT_BANK_ACCOUNT_NAME).
payment.bank.id=VPB
payment.bank.account-number=
payment.bank.account-name=
payment.bank.display-name=VP Bank
payment.bank.transfer-prefix=PETSH
payment.bank.currency=VND

# Bank webhook: the secret MUST be set via secrets.properties or
# PAYMENT_BANK_WEBHOOK_SECRET. When blank, the webhook endpoint rejects
# every request (fail closed).
payment.bank.webhook-secret=

# GHN webhook: the secret MUST be set via secrets.properties or
# PAYMENT_GHN_WEBHOOK_SECRET, and the same value embedded in the webhook URL
# registered on the GHN portal (.../api/ghn/webhook?secret=...).
# When blank, the endpoint rejects every request (fail closed).
payment.ghn.webhook-secret=

# Rate-limit defaults (requests per minute)
ratelimit.login=10
ratelimit.register=6
ratelimit.forgot-password=6
ratelimit.verify-otp=6
ratelimit.reset-password=6
ratelimit.checkout=8
ratelimit.bank-webhook=60
ratelimit.vnpay-ipn=60
ratelimit.add-review=5
ratelimit.search-autocomplete=8

# AI / Commerce Agent Configuration (provider-agnostic, see docs/commerce-agent.md)
# The app talks to services.ai.AiProvider; switching provider/model needs only
# these values — no code changes. Keys MUST come from secrets.properties
# (gitignored) or environment variables. Never commit real keys.
# Switch provider:  AI_PROVIDER=openrouter   (anthropic|openrouter|tokenrouter|openai|gemini|deepseek)
# Switch model:     AI_MODEL=anthropic/claude-sonnet-4-5-20250929
AI_PROVIDER=deepseek
AI_MODEL=
# Cost control: daily agent turns per user + per-session message cap are DB
# settings (AI_MAX_TURNS_PER_DAY=100, AI_MAX_MSGS_PER_SESSION=60 by default,
# tunable in Admin > AI Support or ai_support_settings).
AI_TIMEOUT_SECONDS=30
AI_MAX_TOOL_STEPS=6
AI_MAX_PROMPT_CHARS=12000
# Optional ordered fallbacks "provider:model,...", each tried at most once.
AI_FALLBACKS=
ANTHROPIC_API_KEY=
ANTHROPIC_BASE_URL=https://api.anthropic.com
OPENROUTER_API_KEY=
OPENROUTER_BASE_URL=https://openrouter.ai/api/v1
TOKENROUTER_API_KEY=
TOKENROUTER_BASE_URL=https://api.tokenrouter.ai/v1
OPENAI_API_KEY=
OPENAI_BASE_URL=https://api.openai.com/v1
GOOGLE_API_KEY=
GOOGLE_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai

# Memory (durable facts across sessions; extraction runs post-turn, non-fatal)
AI_MEMORY_ENABLED=true
AI_MEMORY_RETENTION_DAYS=365
AI_MEMORY_BLOCKED_PATTERNS=

# Merchant agent guardrails (demonstration defaults — tune for the real store)
MERCHANT_MAX_ITEMS_PER_CHANGE=25
MERCHANT_MAX_PRICE_DELTA_PCT=20
MERCHANT_MAX_PROMOTION_DISCOUNT_PCT=50
MERCHANT_MAX_RESTOCK_QTY=500
MERCHANT_MAX_CAMPAIGN_BUDGET=10000
MERCHANT_ENABLE_LISTING_EDITS=true
MERCHANT_ENABLE_INVENTORY=true
MERCHANT_ENABLE_PRICING=true
MERCHANT_ENABLE_CAMPAIGNS=true
MERCHANT_REQUIRE_HOST_APPROVAL=true
MERCHANT_APPROVAL_SURFACE=trang quản trị (Admin > AI Merchant)

# Legacy DeepSeek-only keys (still honored as fallback when AI_* are unset)
DEEPSEEK_API_KEY=
DEEPSEEK_BASE_URL=https://api.deepseek.com
DEEPSEEK_MODEL=deepseek-chat
DEEPSEEK_TIMEOUT_SECONDS=30
