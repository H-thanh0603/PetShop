spring:
  application:
    name: petshop
  profiles:
    default: dev
  mvc:
    view:
      prefix: /
      suffix: .jsp
  servlet:
    multipart:
      # Matches the legacy FileUploadServlet programmatic limits (5MB file, 10MB request).
      max-file-size: 5MB
      max-request-size: 10MB
  flyway:
    # Managed explicitly by DataSourceConfig (Flyway bean) — auto-config off.
    enabled: false
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

server:
  port: 8080
  # nginx terminates TLS and forwards; makes Secure cookies/redirects correct
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  file:
    name: logs/petshop.log

# ---- PetShop application config (hợp nhất từ app.properties/db.properties/
# vnpay.properties/ship.properties; secret để env var hoặc secrets.properties) ----
app:
  base-url: http://localhost:8080/PetShop
  context-path: /PetShop
  static:
    cache:
      max-age-seconds: 86400

api:
  provinces:
    base-url: https://provinces.open-api.vn/api/v1

payment:
  bank:
    id: VPB
    display-name: VP Bank
    transfer-prefix: PETSH
    currency: VND
    pending-minutes: 10
    account-number: ""      # PAYMENT_BANK_ACCOUNT_NUMBER
    account-name: ""        # PAYMENT_BANK_ACCOUNT_NAME
    webhook-secret: ""      # PAYMENT_BANK_WEBHOOK_SECRET (fail closed khi trống)
  ghn:
    webhook-secret: ""      # PAYMENT_GHN_WEBHOOK_SECRET (fail closed khi trống)

db:
  host: localhost
  port: 3306
  username: petshop
  password: ""              # PETSHOP_DB_PASSWORD / DB_PASSWORD / MYSQL_PASSWORD
  dbname: petvaccine
  option: useUnicode=true&characterEncoding=utf-8

vnpay:
  tmn-code: ""              # VNPAY_TMN_CODE
  hash-secret: ""           # VNPAY_HASH_SECRET
  pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  return-url: http://localhost:8080/vnpay-return

ratelimit:
  login: 10
  register: 6
  forgot-password: 6
  verify-otp: 6
  reset-password: 6
  checkout: 8
  bank-webhook: 60
  vnpay-ipn: 60
  add-review: 5
  search-autocomplete: 8

# GHN (ship.properties)
TOKEN: ""                   # GHN token — env var TOKEN / GHN_ORDER_TOKEN
GHN_ORDER_TOKEN: ""
SHOP_ID: 200778
FROM_DISTRICT_ID: 3695
